# Two RouterOS instances so multi-device (inventory) support can be exercised
# end to end:
#
#   routeros-a  ->  SSH on host port 2222   (inventory title: RouterA)
#   routeros-b  ->  SSH on host port 2223   (inventory title: RouterB)
#
# Both boot inside QEMU and take ~2 minutes to become healthy.
#
# Which RouterOS runs is decided by the image tag (each image has one RouterOS version baked in):
#   ROUTEROS_IMAGE                      image for both routers (default evilfreelancer/docker-routeros:latest)
#   ROUTEROS_IMAGE_A / ROUTEROS_IMAGE_B image for one router, e.g. to run two versions side by side
#
# Keeping the lab on the newest RouterOS takes more than `up -d`: compose does not pull a newer `latest`, and the data
# volumes keep the disk of the image that created them, so a newer image cannot boot from an old volume (QEMU: Could not
# open '/routeros/chr-<new version>.vdi'). To move to a newer RouterOS:
#
#   docker compose -f routeros-docker/docker-compose.yml pull
#   docker compose -f routeros-docker/docker-compose.yml down -v
#   docker compose -f routeros-docker/docker-compose.yml up -d
#
# `python routeros-docker/check_versions.py` shows which RouterOS each router runs and how far behind that is.
services:
  routeros-a:
    image: ${ROUTEROS_IMAGE_A:-${ROUTEROS_IMAGE:-evilfreelancer/docker-routeros:latest}}
    container_name: ${CONTAINER_NAME_A:-routeros-a}
    hostname: ${HOSTNAME_A:-routeros-a}
    privileged: true
    restart: ${RESTART_POLICY:-unless-stopped}

    # Healthcheck: with eth1 present, QEMU enables hostfwd so 127.0.0.1:8728 is valid
    healthcheck:
      # QEMU accepts TCP the instant it starts, long before the guest boots —
      # only the SSH banner proves RouterOS itself is up.
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 22 </dev/null | grep -q '^SSH-2.0'"]
      interval: 15s
      timeout: 5s
      retries: 40        # ~10 minutes max
      start_period: 120s # RouterOS needs ~2 min to boot inside QEMU


    ports:
      - "${WINBOX_PORT_A:-8291}:8291"
      - "${API_PORT_A:-8728}:8728"
      - "${API_SSL_PORT_A:-8729}:8729"
      - "${FTP_PORT_A:-21}:21"
      - "${SSH_PORT_A:-2222}:22"
      - "${TELNET_PORT_A:-23}:23"
      - "${HTTP_PORT_A:-80}:80"
      - "${HTTPS_PORT_A:-443}:443"
      - "${HTTP_PROXY_PORT_A:-8080}:8080"
      - "${OPENVPN_PORT_A:-1194}:1194"

    networks:
      # Primary network: eth0 — Docker port mappings use this IP
      routeros-net:
        ipv4_address: ${ROUTEROS_IP_A:-172.20.0.2}
      # Secondary network: eth1 — entrypoint uses this for the bridge so eth0
      # keeps its IP and QEMU enables user-mode hostfwd for the health check
      routeros-wan-net:
        ipv4_address: ${ROUTEROS_WAN_IP_A:-172.21.0.2}

    volumes:
      - ${VOLUME_NAME_A:-routeros-data-a}:/routeros

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun

  routeros-b:
    image: ${ROUTEROS_IMAGE_B:-${ROUTEROS_IMAGE:-evilfreelancer/docker-routeros:latest}}
    container_name: ${CONTAINER_NAME_B:-routeros-b}
    hostname: ${HOSTNAME_B:-routeros-b}
    privileged: true
    restart: ${RESTART_POLICY:-unless-stopped}

    healthcheck:
      # QEMU accepts TCP the instant it starts, long before the guest boots —
      # only the SSH banner proves RouterOS itself is up.
      test: ["CMD-SHELL", "nc -w 3 127.0.0.1 22 </dev/null | grep -q '^SSH-2.0'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s


    ports:
      - "${WINBOX_PORT_B:-8292}:8291"
      - "${API_PORT_B:-8738}:8728"
      - "${API_SSL_PORT_B:-8739}:8729"
      - "${FTP_PORT_B:-2121}:21"
      - "${SSH_PORT_B:-2223}:22"
      - "${TELNET_PORT_B:-2323}:23"
      - "${HTTP_PORT_B:-8081}:80"
      - "${HTTPS_PORT_B:-4443}:443"
      - "${HTTP_PROXY_PORT_B:-8098}:8080"
      - "${OPENVPN_PORT_B:-1195}:1194"

    networks:
      routeros-net:
        ipv4_address: ${ROUTEROS_IP_B:-172.20.0.3}
      routeros-wan-net:
        ipv4_address: ${ROUTEROS_WAN_IP_B:-172.21.0.3}

    volumes:
      - ${VOLUME_NAME_B:-routeros-data-b}:/routeros

    cap_add:
      - NET_ADMIN
      - NET_RAW

    devices:
      - /dev/net/tun

networks:
  routeros-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET:-172.20.0.0/24}
          gateway: ${NETWORK_GATEWAY:-172.20.0.1}
  routeros-wan-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${WAN_NETWORK_SUBNET:-172.21.0.0/24}
          gateway: ${WAN_NETWORK_GATEWAY:-172.21.0.1}

volumes:
  routeros-data-a:
    driver: local
  routeros-data-b:
    driver: local
