server_tools:
  list_devices:
    kind: server
    note: Inventory discovery; no RouterOS command.
  safe_mode_status:
    kind: interactive
    note: Reads the persistent safe-mode shell state.
  enable_safe_mode:
    kind: interactive
    note: Opens a persistent shell and sends Ctrl-X.
  commit_safe_mode:
    kind: interactive
    note: Sends Ctrl-X again and closes the safe-mode shell.
  rollback_safe_mode:
    kind: interactive
    note: Closes the shell to trigger RouterOS's automatic revert.
  generate_wireguard_client_config:
    kind: local
    note: Formats a client configuration; does not contact the router.
  test_dns_query:
    kind: command
    note: Runs :resolve on the device.
  create_basic_firewall_setup:
    kind: composite
    note: Adds five /ip/firewall/filter rules in one call.
  check_wireless_support:
    kind: composite
    note: Combines system resource, packages, interfaces and wireless detection.
  get_dns_cache_statistics:
    kind: composite
    note: Combines /ip/dns print with /ip/dns/cache print count-only.
  get_log_statistics:
    kind: composite
    note: Combines /log print count-only with per-topic and time-window counts.
  get_route_statistics:
    kind: composite
    note: Combines several /ip/route print count-only queries.
  monitor_logs:
    kind: composite
    note: Takes a count snapshot, waits, then reads the new entries.
  download_file:
    kind: sftp
    note: Transfers raw bytes over the SSH SFTP subsystem.
  upload_file:
    kind: sftp
    note: Transfers raw bytes over the SSH SFTP subsystem.

