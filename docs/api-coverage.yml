menus:
  /interface:
    title: Interfaces (generic)
    section: Interfaces
    notes: Generic listing and enable/disable. Type-specific creation lives in the dedicated menus.
    commands:
      print:
        status: implemented
        tools: [list_interfaces, get_interface]
        params: [name, type, running, disabled]
        accepted_gaps: [l2mtu, mtu]
      enable:
        status: implemented
        tools: [enable_interface]
        params: [name]
      disable:
        status: implemented
        tools: [disable_interface]
        params: [name]

  /interface/ethernet:
    title: Ethernet
    section: Interfaces
    notes: Not implemented. Link speed, duplex, MTU, flow control and SFP settings are not exposed.
    commands:
