# Declared RouterOS API coverage for the MCP server.
#
# This is the source of truth for docs/api-coverage.md and for the manual
# drift check. A menu/command listed here is in scope; statuses are:
#
#   implemented    - a tool exists and maps to this command
#   partial        - a tool exists, but some advertised behaviour is missing
#   planned        - in scope, no tool yet
#   legacy         - tool exists only for the legacy RouterOS v6 path
#   not_applicable - the command does not exist on RouterOS 7
#
# `accepted_gaps` records manual arguments the mapped tools deliberately do not
# expose: advanced matchers/settings, sensitive values, and features planned in
# another menu. Read-only output fields and flags are excluded from the
# unmapped-argument check automatically.
#
# Keep this file in sync with the tool catalogue and with docs/api-coverage.md.
# Run `python scripts/api_coverage.py --write` after editing.

