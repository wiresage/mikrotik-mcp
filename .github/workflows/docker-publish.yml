# =============================================================================
# GitHub Actions Workflow: Build and Publish multi-arch Docker image to GHCR
# =============================================================================
#
# Purpose:
#   Builds the Docker image for linux/amd64 + linux/arm64 and publishes it to
#   the GitHub Container Registry (ghcr.io/<owner>/<repo>) with a tag that
#   matches the project version — kept in lock-step with the PyPI release.
#
# Versioning:
#   The version is computed with GitVersion (the same tool and GitVersion.yml
#   that publish.yml uses for PyPI), so the image version always matches the
#   package version. We compute it on the master push rather than reacting to
#   the vX.Y.Z git tag, because that tag is created by github-actions[bot] with
#   GITHUB_TOKEN — and GitHub does NOT trigger workflows from token-created
#   tags, so a `tags: ['v*']` trigger would never fire.
#
# Tagging strategy (every push to master that changes a shipped file -- see
# the paths guard below):
#   :X.Y.Z      e.g. :0.10.1   (majorMinorPatch — matches the vX.Y.Z git tag)
#   :X.Y        e.g. :0.10      (floating minor)
#   :latest                     (newest release)
#   :sha-<short>                (exact commit, for traceability)
#
# Registry:
#   ghcr.io/wiresage/mikrotik-mcp
#
# Authentication:
#   Uses the built-in GITHUB_TOKEN (no extra secret required). The token needs
#   packages: write, granted in the job permissions block below.
# =============================================================================
name: Publish Docker Image

on:
  push:
    branches:
      - master
    # Deployment guard: a push releases only when it changes something that is
    # shipped -- the package (src, pyproject.toml), the Docker image (Dockerfile,
    # .dockerignore, docker-entrypoint.sh, and uv.lock, which pins what the image
    # installs) or the MCP
    # registry listing (server.json). A push touching only docs, README, tests,
    # examples or CI config is skipped entirely, so no version, tag, PyPI
    # upload or image is produced for it.
    #
    # Keep this list identical in publish.yml and docker-publish.yml: the image
    # version must always match a PyPI release, so either both run or neither.
    paths:
      - 'src/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-entrypoint.sh'
      - 'server.json'

# One image build at a time, for the same reason as in publish.yml. Builds for
# one version push the same tags (:X.Y.Z, :X.Y, :latest), so two overlapping
# runs let whichever finishes last decide what :latest points at, which can be
# the older commit. Queued, the newest build always finishes last. A build that
# is still waiting is replaced by a newer one; the newer one has the same code
# plus more.
concurrency:
  group: docker
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history required for GitVersion

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v0.10.2
        with:
          versionSpec: '6.x'

      - name: Determine Version
        id: gitversion
        uses: gittools/actions/gitversion/execute@v0.10.2
        with:
          useConfigFile: true

      - name: Display resolved version
        run: |
          echo "majorMinorPatch: ${{ steps.gitversion.outputs.majorMinorPatch }}"
          echo "assemblySemVer:  ${{ steps.gitversion.outputs.assemblySemVer }}"

      # The repo's pyproject.toml carries a placeholder version; the real one is
      # computed by GitVersion at release time. publish.yml already does this
      # before building the PyPI artifact — do the same here so the version
      # baked into the image matches its tag, instead of the placeholder.
      - name: Update version in pyproject.toml
        run: |
          sed -i 's/version = ".*"/version = "${{ steps.gitversion.outputs.assemblySemVer }}"/' pyproject.toml
          grep '^version' pyproject.toml

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          # Tags are fed from the GitVersion-computed version so the image
          # version stays aligned with the vX.Y.Z git tag / PyPI release.
          tags: |
            type=raw,value=${{ steps.gitversion.outputs.majorMinorPatch }}
            type=raw,value=${{ steps.gitversion.outputs.major }}.${{ steps.gitversion.outputs.minor }}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
