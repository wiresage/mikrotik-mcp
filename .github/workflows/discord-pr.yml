name: Discord PR notifications

# Every pull request, merged or not, gets an embed in the Discord channel and a thread. The thread gets the commits of the pull request
# (each one once) and a line when the pull request is reopened, merged or closed. See "Discord notifications" in CONTRIBUTING.md.
#
# Safety, because this runs for pull requests from forks:
#   * `pull_request_target` runs the workflow from master, so fork pull requests get the secret. Nothing from the pull request is checked
#     out or run; its title and commit messages only reach jq as data. Never put `${{ }}` inside the script: pass event data through `env`.
#   * Every message turns mentions off (allowed_mentions), so a title with @everyone pings nobody.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: discord-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BOT: ${{ secrets.DISCORD_BOT_TOKEN }}
      CHANNEL: ${{ vars.DISCORD_CHANNEL_ID }}
      GUILD: ${{ vars.DISCORD_GUILD_ID }}
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      ACTION: ${{ github.event.action }}
      MERGED: ${{ github.event.pull_request.merged }}
      PR: ${{ github.event.pull_request.number }}
      TITLE: ${{ github.event.pull_request.title }}
      URL: ${{ github.event.pull_request.html_url }}
      AUTHOR: ${{ github.event.pull_request.user.login }}
    steps:
      - name: Post to Discord
        shell: bash
        run: |
          set -euo pipefail
          D=https://discord.com/api/v10

          # One call to Discord. A rate limit (429) waits as long as Discord says and tries again, twice at most. Any other error prints
          # what Discord answered (a message and a code, never the token) and fails the step.
          api() {
            local out code url try a
            for a in "$@"; do case $a in https://*) url=${a#"$D"}; break;; esac; done
            for try in 1 2 3; do
              out=$(curl -sS --max-time 30 -w $'\n%{http_code}' -H "Authorization: Bot $BOT" -H "Content-Type: application/json" "$@") || return
              code=${out##*$'\n'}; out=${out%$'\n'*}
              if [ "$code" = 429 ] && [ "$try" -lt 3 ]; then sleep "$(jq -r '(.retry_after // 1) + 0.5' <<<"$out")"; continue; fi
              if [ "$code" -ge 400 ]; then echo "Discord answered $code for $url: $out" >&2; return 22; fi
              printf '%s' "$out"; return 0
            done
          }
          send() { api -X POST "$D/channels/$1/messages" -d "$2"; }
          text() { jq -n --arg c "$1" '{content:$c, flags:4, allowed_mentions:{parse:[]}}'; }
          fmt='.[] | "[`\(.sha[0:7])`](https://github.com/\($r)/commit/\(.sha)) \(.commit.message | split("\n")[0] | .[0:60])"'

          # Post the commits of the pull request that the thread does not show yet, all of them, in as many messages as it takes.
          # Looking at what the thread shows (instead of comparing with the previous push) means that a force push, a push that came
          # while another run was waiting, or a re-run can neither lose a commit nor repeat one. $1 is the first line of a message.
          announce() {
            local seen commits new msg line
            seen=$(api "$D/channels/$THREAD/messages?limit=100" | jq -r '.[].content | scan("/commit/([0-9a-f]{40})") | .[0]')
            commits=$(gh api "repos/$REPO/pulls/$PR/commits?per_page=100" --paginate | jq -s 'add // []')
            new=$(jq -r --arg seen "$seen" --arg r "$REPO" '($seen | split("\n")) as $s | map(select(.sha as $x | ($s | index($x)) == null)) | '"$fmt" <<<"$commits")
            [ -n "$new" ] || return 0
            msg=$1
            while IFS= read -r line; do
              if [ $(( ${#msg} + ${#line} + 1 )) -gt 1900 ]; then send "$THREAD" "$(text "$msg")" >/dev/null; msg=$1; fi
              msg+=$'\n'$line
            done <<<"$new"
            send "$THREAD" "$(text "$msg")" >/dev/null
          }

          # Find this PR's thread: active threads first, then recently archived ones. Discord archives a thread that was quiet for
          # 7 days; a message posted into an archived thread opens it again (checked on the real Discord), so nothing more is needed.
          THREAD=$({ api "$D/guilds/$GUILD/threads/active"; api "$D/channels/$CHANNEL/threads/archived/public?limit=100"; } |
            jq -rs --arg c "$CHANNEL" --arg p "PR #$PR " \
              '[.[].threads[]? | select(.parent_id==$c and (.name|startswith($p)))][0].id // empty')

          CREATED=0
          if [ -z "$THREAD" ]; then
            # A thread's id equals the id of the message it starts from.
            THREAD=$(send "$CHANNEL" "$(jq -n --arg t "PR #$PR: $TITLE" --arg u "$URL" --arg a "$AUTHOR" \
              '{embeds:[{title:($t|.[0:250]), url:$u, description:("by "+$a), color:5025616}], allowed_mentions:{parse:[]}}')" | jq -r .id)
            api -X POST "$D/channels/$CHANNEL/messages/$THREAD/threads" \
              -d "$(jq -n --arg n "PR #$PR $TITLE" '{name:($n|.[0:100]), auto_archive_duration:10080}')" >/dev/null
            CREATED=1
          fi

          if [ "$CREATED" = 1 ]; then
            announce "Commits:"
          elif [ "$ACTION" = synchronize ]; then
            announce "New commits:"
          elif [ "$ACTION" = reopened ]; then
            send "$THREAD" "$(text "Reopened")" >/dev/null
            announce "New commits:"
          fi

          if [ "$ACTION" = closed ]; then
            if [ "$MERGED" = true ]; then
              send "$CHANNEL" "$(jq -n --arg t "✅ PR #$PR merged: $TITLE" --arg u "$URL" --arg r "$THREAD" \
                '{embeds:[{title:($t|.[0:250]), url:$u, color:8311585}], message_reference:{message_id:$r, fail_if_not_exists:false}, allowed_mentions:{parse:[]}}')" >/dev/null
              send "$THREAD" "$(text "Merged ✅")" >/dev/null
            else
              send "$THREAD" "$(text "Closed without merging")" >/dev/null
            fi
          fi
          exit 0
