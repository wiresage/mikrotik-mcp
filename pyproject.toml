[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-server-mikrotik"
# Placeholder only: the real version is computed by GitVersion and injected
# into this line by CI at release time (see .github/workflows/publish.yml).
version = "0.0.0"
description = "MCP server for MikroTik integration with Claude and other AI assistants"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Jeff Nasseri", email = "sir.jeff.nasseri@gmail.com"}
]
keywords = ["mcp", "mikrotik", "router", "network", "ai", "assistant"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: System :: Networking",
]
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "paramiko>=3.5.1",
    "pydantic>=2.11.4",
    "pydantic-settings>=2.9.1",
    "PyYAML>=6.0",
    "starlette>=0.27.0",
]

[project.urls]
Homepage = "https://github.com/wiresage/mikrotik-mcp"
Issues = "https://github.com/wiresage/mikrotik-mcp/issues"
Repository = "https://github.com/wiresage/mikrotik-mcp"

[project.scripts]
mcp-server-mikrotik = "mcp_mikrotik.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_mikrotik"]

# Hatchling puts every tracked file in the sdist by default (docs, tests, CI, the
# lockfile, about 1.2 MB). The setuptools sdist this replaces held only these.
[tool.hatch.build.targets.sdist]
include = ["/src", "/LICENSE", "/README.md", "/pyproject.toml"]

# Test tooling only: installed by `uv sync` / `uv run`, never shipped in the
# wheel or the Docker image. PyYAML is a runtime dependency above.
[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "testcontainers>=4.0.0",
]
